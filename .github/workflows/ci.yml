name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck, build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: interviewprep_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d interviewprep_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Tests mock the AI service, so Chrome is not needed in CI.
      PUPPETEER_SKIP_DOWNLOAD: "true"
      TEST_DATABASE_URL: postgresql://app:testpass@localhost:5432/interviewprep_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint  

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --ci

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build